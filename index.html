<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; color: #ffffff; }
    p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .tag {
      background-color: #334155;
      color: #cbd5e1;
      font-size: 0.85rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
    }
    .links { display: flex; gap: 1rem; }
    .btn {
      display: inline-block;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Under Construction</span>
    <h1>Hi, I'm Ben</h1>
    <p>I'm currently working on my personal website.</p>
    
    <div class="project-tags">
      <span class="tag">Projects</span>
      <span class="tag">Restorations</span>
    </div>

    <div class="links">
      <a href="https://github.com/benarthurs" class="btn" target="_blank">GitHub Profile</a>
    </div>
  </div>
</body>
</html>
